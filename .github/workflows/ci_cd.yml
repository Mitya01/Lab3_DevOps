name: Python Spam Classifier CI/CD Pipeline  # ИСПРАВЛЕНО

on:
  push:
    branches: [main, develop]  # ИСПРАВЛЕНО
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # ИСПРАВЛЕНО

      - name: Setup Python 3.11
        uses: actions/setup-python@v5  # ИСПРАВЛЕНО
        with:
          python-version: '3.11'
          cache: 'pip'  # ИСПРАВЛЕНО

      - name: Install linting dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run black formatting check
        run: |
          python -m black --check .

      - name: Run mypy type checking
        run: |
          python -m mypy --ignore-missing-imports .

  test:
    runs-on: ubuntu-latest
    needs: lint  # ИСПРАВЛЕНО: Зависимость от линтинга
    steps:
      - uses: actions/checkout@v4  # ИСПРАВЛЕНО

      - name: Setup Python 3.11
        uses: actions/setup-python@v5  # ИСПРАВЛЕНО
        with:
          python-version: '3.11'
          cache: 'pip'  # ИСПРАВЛЕНО

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Cache NLTK data
        uses: actions/cache@v3  # ИСПРАВЛЕНО
        with:
          path: ~/nltk_data
          key: ${{ runner.os }}-nltk-data
          restore-keys: |
            ${{ runner.os }}-nltk-data

      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('stopwords', quiet=True)"  # ИСПРАВЛЕНО

      - name: Run tests with coverage
        run: |
          python -m pytest tests/